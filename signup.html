<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create account | YourStore</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Same colors as index.html -->
    <style type="text/tailwindcss">
        @theme {
            --color-brand: #4338ca;
            --color-brand-dark: #3730a3;
            --color-brand-light: #eef2ff;
            --color-accent: #c2410c;
        }
    </style>
</head>

<body class="flex min-h-screen items-center justify-center bg-gray-100 px-4 py-12 font-sans text-gray-900">
    <main class="w-full max-w-sm">
        <a href="index.html" class="block text-center text-2xl font-bold text-brand">YourStore</a>

        <div class="mt-6 rounded-2xl bg-white p-8 shadow-md">
            <h1 class="text-2xl font-semibold">Create account</h1>
            <p class="mt-1 text-sm text-gray-600">It takes less than a minute.</p>

            <form id="signup-form" class="mt-6 space-y-5">
                <div>
                    <label for="signup-name" class="block text-sm font-medium">Full name</label>
                    <input type="text" id="signup-name" name="name" autocomplete="name" required
                        class="mt-2 w-full rounded-lg border border-gray-200 px-3 py-2 focus-visible:ring-2 focus-visible:ring-brand">
                </div>
                <div>
                    <label for="signup-email" class="block text-sm font-medium">Email</label>
                    <input type="email" id="signup-email" name="email" autocomplete="email" required
                        class="mt-2 w-full rounded-lg border border-gray-200 px-3 py-2 focus-visible:ring-2 focus-visible:ring-brand">
                </div>
                <div>
                    <label for="signup-password" class="block text-sm font-medium">Password</label>
                    <input type="password" id="signup-password" name="password" autocomplete="new-password"
                        minlength="6" required
                        class="mt-2 w-full rounded-lg border border-gray-200 px-3 py-2 focus-visible:ring-2 focus-visible:ring-brand">
                    <p class="mt-1 text-xs text-gray-500">At least 6 characters.</p>
                </div>
                <div>
                    <label for="signup-confirm" class="block text-sm font-medium">Confirm password</label>
                    <input type="password" id="signup-confirm" name="confirm" autocomplete="new-password" required
                        class="mt-2 w-full rounded-lg border border-gray-200 px-3 py-2 focus-visible:ring-2 focus-visible:ring-brand">
                </div>

                <!-- JS later: show signup errors here -->
                <p id="signup-error" role="alert" class="hidden text-sm text-accent"></p>

                <button type="submit"
                    class="w-full cursor-pointer rounded-lg bg-brand py-2.5 font-semibold text-white hover:bg-brand-dark focus-visible:ring-2 focus-visible:ring-brand">Create
                    account</button>
            </form>
        </div>

        <p class="mt-6 text-center text-sm text-gray-600">Already have an account?
            <a href="login.html" class="font-semibold text-brand hover:underline">Sign in</a>
        </p>
    </main>
</body>

</html>
